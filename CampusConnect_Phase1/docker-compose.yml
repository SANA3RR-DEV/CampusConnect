services:
  db:
    image: postgres:16-alpine
    container_name: campusconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusconnect}
      POSTGRES_USER: ${POSTGRES_USER:-campusconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "5432:5432"
    volumes:
      - campusconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusconnect -d campusconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusconnect_pgdata:
